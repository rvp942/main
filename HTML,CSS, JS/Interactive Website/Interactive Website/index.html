<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Specifies character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the website responsive -->
    <title>Interactive Website</title>
    <link rel="stylesheet" href="style.css"> <!-- Links to the external CSS file -->
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <h1>Welcome to My Interactive Website</h1> <!-- Heading -->
        <p>Click the button below to change the background color!</p> <!-- Instruction text -->
        <button id="colorButton">Change Background Color</button> <!-- Button for changing background color -->
    </div>
    <script src="script.js"></script> <!-- Links to the external JavaScript file -->
</body>
</html>
